<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0b0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Orchard">
  <title>Orchard</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <aside id="sidebar">
    <nav class="panel" id="nav"></nav>
    <section class="panel library">
      <header id="libhead"></header>
      <nav class="side-tabs" id="lib-chips" aria-label="Your Library"></nav>
      <div class="side-tools" id="side-tools"></div>
      <div class="lib-list" id="lib-list"></div>
    </section>
  </aside>

  <main id="main" class="panel">
    <div class="topbar"><button class="nav-btn" id="back" aria-label="Back"></button></div>
    <div id="view"></div>
  </main>

  <aside id="right" class="panel" hidden></aside>
  <footer id="player"></footer>
  <nav id="tabs"></nav>

  <!-- Host app only: Apple's music.apple.com player lives here, invisible, as Orchard's audio engine. -->
  <div id="engine-host">
    <div class="engine-bar">
      <span class="engine-note">Apple Music · Music plays through this page. Sign in here if asked; it hides again automatically.</span>
      <button class="btn small" id="engine-back">Back <kbd>Ctrl+Shift+A</kbd></button>
    </div>
  </div>

  <div id="fullplayer" hidden></div>
  <div id="overlay" hidden></div>
  <div id="menu" hidden></div>
  <div id="popover" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
