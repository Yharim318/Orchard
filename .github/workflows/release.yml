# Builds orchard.exe on Windows and publishes it as a GitHub release. Every Orchard with automatic updates on
# (Settings > Updates) picks the release up within a few hours and installs it.
#
# Start a release either way:
#   - Actions tab > Release > Run workflow, and type the version (e.g. 0.2.0), or
#   - push a tag:  git tag v0.2.0 && git push origin v0.2.0
# The version is written into Orchard.java for the build, so the exe always reports its release's version.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.2.0 (must be higher than the last release)'
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set the version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          $v = if ($env:EVENT -eq 'workflow_dispatch') { $env:INPUT_VERSION } else { $env:REF_NAME }
          $v = $v.Trim() -replace '^[vV]', ''
          if ($v -notmatch '^\d+(\.\d+){1,3}$') { throw "'$v' isn't a version like 0.2.0" }
          $file = 'src/main/java/orchard/Orchard.java'
          $src = Get-Content $file -Raw
          if ($src -notmatch 'static final String VERSION = "[^"]*"' -or $src -notmatch 'static final boolean RELEASE_BUILD = (true|false)') {
            throw "Couldn't find VERSION / RELEASE_BUILD in $file"
          }
          $new = $src -replace 'static final String VERSION = "[^"]*"', "static final String VERSION = `"$v`""
          $new = $new -replace 'static final boolean RELEASE_BUILD = false', 'static final boolean RELEASE_BUILD = true'
          Set-Content $file $new -NoNewline
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Check the exe
        shell: pwsh
        run: |
          # The updater runs every download like this before installing it, so a release must pass it too.
          $got = (& build\orchard.exe --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "orchard.exe --version failed (exit code $LASTEXITCODE)" }
          if ($got -and $got -ne '${{ steps.version.outputs.version }}') { throw "orchard.exe reports version '$got'" }
          Write-Host "orchard.exe --version: $got"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Orchard ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: build/orchard.exe
